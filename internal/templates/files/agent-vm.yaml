modules:
  - node      # Node.js LTS + npm/pnpm/yarn
  - dotnet    # .NET SDK (LTS)
  - go        # Go toolchain (latest stable)
  - docker    # Docker CE
  - claude    # Claude Code CLI (needs node)
  - codex     # OpenAI Codex CLI (needs node)

resources:
  cpus: 4
  memory: 4GiB
  disk: 120GiB

# Additional host folders to mount alongside the project (paths relative to this
# file). Each is mounted read/write at ~/<basename> inside the VM. Use the
# object form with `name:` to override the guest directory name on a collision.
# mounts:
#   - ../shared-lib
#   - path: ../tools/cli
#     name: cli-tools
